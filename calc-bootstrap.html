<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계산기 - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-transparent p-2">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="h4 text-center mb-1">사칙연산 계산기</h1>
      <p class="text-center text-muted small mb-3">Bootstrap 스타일</p>

      <form>
        <div class="input-group input-group-sm mb-2">
          <input type="number" name="num1" class="form-control" placeholder="숫자 1" step="any">
          <select name="op" class="form-select" style="flex: 0 0 72px;">
            <option value="+">+</option>
            <option value="-">−</option>
            <option value="*">×</option>
            <option value="/">÷</option>
          </select>
          <input type="number" name="num2" class="form-control" placeholder="숫자 2" step="any">
        </div>
        <button type="submit" class="btn btn-primary btn-sm w-100 mb-2">계산</button>

        <div class="input-group input-group-sm">
          <span class="input-group-text">결과</span>
          <input type="text" name="result" class="form-control fw-bold" placeholder="결과" readonly>
        </div>
        <p class="message text-danger text-center small mt-2 mb-0"></p>
      </form>
    </div>
  </div>

  <script src="calc.js"></script>
  <script>
    setupCalculator(document.querySelector('form'));
  </script>
</body>
</html>
