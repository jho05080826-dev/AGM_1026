<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계산기</title>
  <style>
    body {
      text-align: center;
      font-family: sans-serif;
    }
    h1 {
      font-size: 40px;
    }
    input {
      width: 120px;
      padding: 8px;
      font-size: 18px;
    }
    select,
    button {
      padding: 8px;
      font-size: 18px;
      cursor: pointer;
    }
    button {
      width: 50px;
    }
    #result {
      font-weight: bold;
      background: #f3f3f3;
    }
    #message {
      color: red;
    }
  </style>
</head>
<body>
  <h1>계산기</h1>

  <p>
    <input type="number" id="num1" placeholder="첫 번째 숫자">
    <select id="op">
      <option value="+">+</option>
      <option value="-">−</option>
      <option value="*">×</option>
      <option value="/">÷</option>
    </select>
    <input type="number" id="num2" placeholder="두 번째 숫자">
    <button onclick="calc()">=</button>
    <input type="text" id="result" placeholder="결과" readonly>
  </p>
  <p id="message"></p>

  <script>
    function calc() {
      var op = document.getElementById('op').value;
      var a = document.getElementById('num1').value;
      var b = document.getElementById('num2').value;
      var result = document.getElementById('result');
      var message = document.getElementById('message');

      result.value = '';
      message.textContent = '';

      if (a === '' || b === '') {
        message.textContent = '숫자 두 개를 모두 입력하세요.';
        return;
      }

      a = Number(a);
      b = Number(b);
      var answer;

      if (op === '+') answer = a + b;
      if (op === '-') answer = a - b;
      if (op === '*') answer = a * b;
      if (op === '/') {
        if (b === 0) {
          message.textContent = '0으로 나눌 수 없습니다.';
          return;
        }
        answer = a / b;
      }

      // 0.1 + 0.2 같은 소수점 오차 정리
      answer = parseFloat(answer.toPrecision(12));
      result.value = answer;
    }
  </script>
</body>
</html>
