<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사칙연산 계산기</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      background: #f1f3f5;
      font-family: sans-serif;
      text-align: center;
    }
    .calculators {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }
    /* 스타일끼리 클래스 이름이 겹치지 않도록 계산기마다 별도 파일을 iframe으로 불러온다 */
    .calculators iframe {
      width: 320px;
      max-width: 100%;
      height: 360px;
      border: none;
    }
  </style>
</head>
<body>
  <h1>사칙연산 계산기</h1>

  <div class="calculators">
    <iframe src="calc-bootstrap.html" title="Bootstrap 계산기"></iframe>
    <iframe src="calc-tailwind.html" title="Tailwind 계산기"></iframe>
    <iframe src="calc-materialize.html" title="Materialize 계산기"></iframe>
  </div>
</body>
</html>
